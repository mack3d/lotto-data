name: Full Scrape (pierwsze uruchomienie)

on:
  workflow_dispatch:

jobs:
  full-scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Full scrape Multi Multi
        run: python scraper.py --full

      - name: Full scrape Mini Lotto
        run: python scraper_minilotto.py --full

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Full scrape $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
