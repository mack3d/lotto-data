name: Scrape Multi Multi

on:
  schedule:
    # 14:35 i 22:35 czasu polskiego (UTC+2) = 12:35 i 20:35 UTC
    - cron: '35 12 * * *'
    - cron: '35 20 * * *'
  workflow_dispatch:  # możliwość ręcznego uruchomienia

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # pozwól na commit do repozytorium

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update draws $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
